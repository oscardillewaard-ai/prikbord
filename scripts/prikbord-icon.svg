<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Prikbord-icoon: kurk, een afgescheurd geel briefje en een rode punaise.
       Iconen opnieuw maken: npm run icons -->
  <defs>
    <filter id="kurk" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="4" result="ruis"/>
      <feColorMatrix in="ruis" values="0 0 0 0 0.30  0 0 0 0 0.17  0 0 0 0 0.06  0 0 0 2.4 -1.1"/>
    </filter>
    <filter id="vlek" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.74  0 0 0 0 0.50  0 0 0 1.6 -0.7"/>
    </filter>
    <filter id="schaduw" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="5" dy="14" stdDeviation="11" flood-color="#2b1708" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="pin" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffb3ab"/>
      <stop offset="0.35" stop-color="#e5483d"/>
      <stop offset="1" stop-color="#7f1d17"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#b57b45"/>
  <rect width="512" height="512" filter="url(#vlek)"/>
  <rect width="512" height="512" filter="url(#kurk)"/>
  <g filter="url(#schaduw)" transform="rotate(-6 256 280)">
    <path fill="#fde68a" d="M112 150 L126 141 L139 149 L153 138 L168 147 L181 140 L197 150 L211 139 L226 146 L240 137
      L255 148 L270 140 L284 149 L299 138 L313 146 L328 139 L342 149 L357 140 L371 147 L386 139 L400 148
      L400 410 L112 410 Z"/>
    <path fill="none" stroke="#3b2a1a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
      d="M150 238 q22 -16 44 0 t44 0 t44 0 t44 0 M150 296 q22 -16 44 0 t44 0 t44 0 M150 354 q22 -16 44 0 t44 0"/>
  </g>
  <ellipse cx="262" cy="196" rx="34" ry="12" fill="#2b1708" opacity="0.35"/>
  <circle cx="256" cy="168" r="36" fill="url(#pin)"/>
  <circle cx="244" cy="155" r="9" fill="#fff" opacity="0.7"/>
</svg>
