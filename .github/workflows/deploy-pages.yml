# Deploy van Prikbord naar GitHub Pages (zie docs/prikbord-afwijkingen.md, A3).
# Draait bij een push naar main of met de hand. Eerst lint en tests: gaat er
# iets mis, dan blijft de vorige versie gewoon online staan. Alleen de map
# public/ gaat naar Pages; docs, tests en scripts blijven in de repo.
# Vóór de eerste deploy: Settings → Pages → Source op "GitHub Actions".

name: Deploy naar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
