<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <!-- Kurk A (klassiek): warm middenbruin met fijne donkere korrels. -->
  <filter id="grof" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.86  0 0 0 0 0.62  0 0 0 0 0.38  0 0 0 1.5 -0.6"/>
  </filter>
  <filter id="fijn" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.2  0 0 0 0 0.08  0 0 0 3 -1.38"/>
  </filter>
  <filter id="licht" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.96  0 0 0 0 0.8  0 0 0 0 0.58  0 0 0 3 -1.5"/>
  </filter>
  <rect width="256" height="256" fill="#b07642"/>
  <rect width="256" height="256" filter="url(#grof)"/>
  <rect width="256" height="256" filter="url(#fijn)"/>
  <rect width="256" height="256" filter="url(#licht)"/>
</svg>
