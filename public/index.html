<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Een prikbord vol afgescheurde briefjes: to-do's, bucketlist, vakantie-ideetjes en recepten. Samen met wie je wilt." />
    <meta name="theme-color" content="#5b3a1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prikbord" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/caveat-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <title>Prikbord</title>
  </head>
  <body>
    <!-- Het hartje, één keer getekend en overal hergebruikt (in de kleur van wie het gaf). -->
    <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="hart" viewBox="0 0 24 24">
        <path d="M12 21.3c-.3 0-.6-.1-.8-.3C7.3 17.9 2.4 13.8 2.4 8.9 2.4 6 4.7 3.6 7.6 3.6c1.8 0 3.4.9 4.4 2.4 1-1.5 2.6-2.4 4.4-2.4 2.9 0 5.2 2.4 5.2 5.3 0 4.9-4.9 9-8.8 12.1-.2.2-.5.3-.8.3z" />
      </symbol>
    </svg>
    <header class="kop">
      <h1 class="kop-h1"><button type="button" id="kop-titel" class="kop-bord" aria-haspopup="dialog"><span class="kop-emoji" aria-hidden="true">📌</span> Prikbord</button></h1>
      <div id="kop-rechts" class="kop-rechts"></div>
    </header>

    <main id="view" tabindex="-1"></main>

    <button id="blok" class="scheurblok" type="button" aria-label="Nieuw briefje schrijven">
      <span class="blok-vel" aria-hidden="true"><span class="blok-plus">+</span></span>
    </button>

    <nav class="tabbar" aria-label="Onderdelen">
      <button type="button" data-tab="bord" aria-current="page"><span aria-hidden="true">📌</span>Bord</button>
      <button type="button" data-tab="kaart"><span aria-hidden="true">🗺️</span>Kaart</button>
      <button type="button" data-tab="gedaan"><span aria-hidden="true">📦</span>Gedaan-doos</button>
      <button type="button" data-tab="meer"><span aria-hidden="true">⚙️</span>Meer</button>
    </nav>

    <dialog id="laag" class="laag" aria-labelledby="laag-titel"></dialog>
    <div id="sr" class="vh" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" popover="manual" hidden></div>
    <input id="import-bestand" type="file" accept="application/json,.json" hidden />

    <script type="module" src="js/app.js"></script>
  </body>
</html>
