<!doctype html>
<html lang="nl" data-stijl="a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Een prikbord vol afgescheurde briefjes: to-do's, bucketlist, vakantie-ideetjes en recepten. Samen met wie je wilt." />
    <meta name="theme-color" content="#5b3a1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prikbord" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/caveat-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <title>Prikbord</title>
  </head>
  <body>
    <header class="kop">
      <h1 id="kop-titel"><span class="kop-emoji" aria-hidden="true">📌</span> Prikbord</h1>
    </header>

    <main id="view" tabindex="-1"></main>

    <button id="blok" class="scheurblok" type="button" aria-label="Nieuw briefje schrijven">
      <span class="blok-vel" aria-hidden="true"><span class="blok-plus">+</span></span>
    </button>

    <nav class="tabbar" aria-label="Onderdelen">
      <button type="button" data-tab="bord" aria-current="page"><span aria-hidden="true">📌</span>Bord</button>
      <button type="button" data-tab="kaart"><span aria-hidden="true">🗺️</span>Kaart</button>
      <button type="button" data-tab="gedaan"><span aria-hidden="true">📦</span>Gedaan-doos</button>
      <button type="button" data-tab="meer"><span aria-hidden="true">⚙️</span>Meer</button>
    </nav>

    <dialog id="laag" class="laag" aria-labelledby="laag-titel"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" popover="manual" hidden></div>
    <input id="import-bestand" type="file" accept="application/json,.json" hidden />

    <script type="module" src="js/app.js"></script>
  </body>
</html>
